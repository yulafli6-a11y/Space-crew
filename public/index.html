<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Space Crew Online</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
 box-sizing:border-box;
 user-select:none;
}

body{
 margin:0;
 overflow:hidden;
 background:#070b15;
 color:white;
 font-family:Arial,sans-serif;
}

canvas{
 display:block;
}

#menu,
#lobby{
 position:fixed;
 inset:0;
 z-index:20;
 background:#080b14;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}

#lobby{
 display:none;
}

h1{
 font-size:42px;
 margin:10px;
}

input{
 width:260px;
 padding:14px;
 margin:5px;
 border:0;
 border-radius:10px;
 font-size:16px;
}

button{
 border:0;
 border-radius:10px;
 padding:13px 20px;
 margin:5px;
 background:#3b82f6;
 color:white;
 font-weight:bold;
 font-size:15px;
}

#roomCode{
 font-size:32px;
 letter-spacing:6px;
 margin:15px;
 color:#ffd43b;
}

#players{
 width:300px;
 max-height:220px;
 overflow:auto;
 background:#111827;
 border-radius:12px;
 padding:10px;
}

.playerItem{
 padding:8px;
 border-bottom:1px solid #30394c;
}

#gameUI{
 display:none;
}

#hud{
 position:fixed;
 top:10px;
 left:10px;
 z-index:10;
 background:#101827dd;
 padding:10px;
 border-radius:10px;
}

#chat{
 position:fixed;
 left:10px;
 bottom:10px;
 width:310px;
 z-index:10;
}

#messages{
 height:140px;
 overflow:auto;
 background:#080b14dd;
 padding:10px;
 border-radius:10px;
 margin-bottom:5px;
}

#chatInput{
 width:220px;
}

#controls{
 position:fixed;
 right:15px;
 bottom:20px;
 z-index:10;
}

#controls button{
 width:55px;
 height:55px;
 padding:0;
 font-size:20px;
}

#error{
 color:#ff5555;
 margin:10px;
}
</style>
</head>

<body>

<div id="menu">

<h1>🚀 SPACE CREW</h1>

<input
 id="nameInput"
 maxlength="16"
 placeholder="Astronot adın">

<button onclick="createRoom()">
ODA OLUŞTUR
</button>

<input
 id="codeInput"
 maxlength="6"
 inputmode="numeric"
 placeholder="6 haneli oda kodu">

<button onclick="joinRoom()">
ODAYA KATIL
</button>

<div id="error"></div>

</div>


<div id="lobby">

<h1>🚀 LOBİ</h1>

<div>ODA KODU</div>

<div id="roomCode">
------
</div>

<div id="players"></div>

<div id="lobbyButtons">

<button id="startButton"
onclick="startGame()">
OYUNU BAŞLAT
</button>

<button onclick="leaveRoom()">
AYRIL
</button>

</div>

</div>


<canvas id="game"></canvas>


<div id="gameUI">

<div id="hud">
🌐 Online |
Oyuncular:
<span id="playerCount">1</span>
</div>


<div id="chat">

<div id="messages"></div>

<input
 id="chatInput"
 maxlength="120"
 placeholder="Free Chat...">

<button onclick="sendChat()">
Gönder
</button>

</div>


<div id="controls">

<div>
<button data-key="w">▲</button>
</div>

<div>
<button data-key="a">◀</button>
<button data-key="s">▼</button>
<button data-key="d">▶</button>
</div>

</div>

</div>


<script>

const socket=io();

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");


function resize(){

 canvas.width=innerWidth;
 canvas.height=innerHeight;

}

resize();

addEventListener(
"resize",
resize
);


let playing=false;

let roomCode="";

let players={};


const me={
 x:600,
 y:350,
 color:"#e53935",
 name:"Astronot",
 speed:4
};


const keys={
 w:false,
 a:false,
 s:false,
 d:false
};


function getName(){

 const value=
 document.getElementById(
 "nameInput"
 ).value.trim();

 return value||"Astronot";

}


function createRoom(){

 const name=getName();

 socket.emit(
 "createRoom",
 name
 );

}


function joinRoom(){

 const name=getName();

 const code=
 document.getElementById(
 "codeInput"
 ).value.trim();

 if(code.length!==6){

  showError(
   "6 haneli oda kodu gir."
  );

  return;

 }

 socket.emit(
  "joinRoom",
  {
   name:name,
   code:code
  }
 );

}


socket.on(
"roomCreated",
code=>{

 roomCode=code;

 showLobby();

});


socket.on(
"joinedRoom",
code=>{

 roomCode=code;

 showLobby();

});


socket.on(
"roomError",
message=>{

 showError(message);

});


socket.on(
"roomData",
data=>{

 updateLobby(data);

});


socket.on(
"gameStarted",
()=>{

 document.getElementById(
 "lobby"
 ).style.display="none";

 document.getElementById(
 "gameUI"
 ).style.display="block";

 playing=true;

});


function showLobby(){

 document.getElementById(
 "menu"
 ).style.display="none";

 document.getElementById(
 "lobby"
 ).style.display="flex";

 document.getElementById(
 "roomCode"
 ).textContent=roomCode;

}


function updateLobby(data){

 const list=
 document.getElementById(
 "players"
 );

 list.innerHTML="";

 data.players.forEach(
 player=>{

  const div=
  document.createElement("div");

  div.className="playerItem";

  div.textContent=
  "🧑‍🚀 "+player.name;

  if(player.id===data.host){

   div.textContent+=
   " 👑";

  }

  list.appendChild(div);


  if(player.id===socket.id){

   me.x=player.x;
   me.y=player.y;
   me.color=player.color;
   me.name=player.name;

  }

  if(
   player.id!==socket.id
  ){

   createOtherPlayer(player);

  }

 });

 document.getElementById(
 "playerCount"
 ).textContent=
 data.players.length;

}


function startGame(){

 socket.emit(
  "startGame"
 );

}


function leaveRoom(){

 location.reload();

}


function createOtherPlayer(player){

 if(players[player.id]){

  players[player.id]
  .element.remove();

 }

 const element=
 document.createElement("div");

 element.style.position="fixed";
 element.style.width="42px";
 element.style.height="55px";
 element.style.pointerEvents="none";
 element.style.zIndex="4";

 element.innerHTML=`

 <div style="
 position:absolute;
 left:5px;
 bottom:0;
 width:32px;
 height:38px;
 border-radius:15px 15px 10px 10px;
 background:${player.color};
 "></div>

 <div style="
 position:absolute;
 left:15px;
 top:5px;
 width:25px;
 height:17px;
 background:#b9f4ff;
 border:3px solid #26384b;
 border-radius:12px;
 "></div>

 <div style="
 position:absolute;
 width:120px;
 left:-39px;
 top:-20px;
 text-align:center;
 color:white;
 font-size:11px;
 ">
 ${escapeHTML(player.name)}
 </div>

 `;

 document.body.appendChild(
  element
 );

 players[player.id]={
  x:player.x,
  y:player.y,
  element:element
 };

 updateOtherPlayer(
  player.id
 );

}


socket.on(
"playerJoined",
player=>{

 if(
  player.id!==socket.id
 ){

  createOtherPlayer(player);

 }

});


socket.on(
"playerMoved",
data=>{

 if(!players[data.id])return;

 players[data.id].x=data.x;
 players[data.id].y=data.y;

 updateOtherPlayer(
  data.id
 );

});


socket.on(
"playerLeft",
id=>{

 if(players[id]){

  players[id]
  .element.remove();

  delete players[id];

 }

});


function updateOtherPlayer(id){

 const p=players[id];

 if(!p)return;

 p.element.style.left=
 (p.x-21)+"px";

 p.element.style.top=
 (p.y-27)+"px";

}


document.addEventListener(
"keydown",
e=>{

 const key=e.key.toLowerCase();

 if(key in keys){

  keys[key]=true;

 }

 if(e.key==="Enter"){

  sendChat();

 }

});


document.addEventListener(
"keyup",
e=>{

 const key=e.key.toLowerCase();

 if(key in keys){

  keys[key]=false;

 }

});


document.querySelectorAll(
"#controls button"
).forEach(button=>{

 const key=
 button.dataset.key;

 button.addEventListener(
 "pointerdown",
 ()=>keys[key]=true
 );

 button.addEventListener(
 "pointerup",
 ()=>keys[key]=false
 );

 button.addEventListener(
 "pointerleave",
 ()=>keys[key]=false
 );

});


function update(){

 if(!playing)return;

 let moved=false;

 if(keys.w){
  me.y-=me.speed;
  moved=true;
 }

 if(keys.s){
  me.y+=me.speed;
  moved=true;
 }

 if(keys.a){
  me.x-=me.speed;
  moved=true;
 }

 if(keys.d){
  me.x+=me.speed;
  moved=true;
 }

 me.x=Math.max(
  30,
  Math.min(
   canvas.width-30,
   me.x
  )
 );

 me.y=Math.max(
  30,
  Math.min(
   canvas.height-30,
   me.y
  )
 );

 if(moved){

  socket.emit(
   "move",
   {
    x:me.x,
    y:me.y
   }
  );

 }

}


function draw(){

 ctx.fillStyle="#101827";

 ctx.fillRect(
  0,
  0,
  canvas.width,
  canvas.height
 );

 drawStars();
 drawRooms();
 drawPlayer();

}


function drawStars(){

 for(let i=0;i<80;i++){

  const x=
  (i*137)%
  canvas.width;

  const y=
  (i*83)%
  canvas.height;

  ctx.fillStyle="#ffffff55";

  ctx.fillRect(
   x,y,2,2
  );

 }

}


function drawRooms(){

 const rooms=[

 {
  x:40,
  y:50,
  w:260,
  h:170,
  name:"KAFETERYA"
 },

 {
  x:canvas.width-300,
  y:50,
  w:260,
  h:170,
  name:"KONTROL"
 },

 {
  x:40,
  y:canvas.height-220,
  w:260,
  h:170,
  name:"REAKTÖR"
 },

 {
  x:canvas.width-300,
  y:canvas.height-220,
  w:260,
  h:170,
  name:"DEPO"
 },

 {
  x:canvas.width/2-150,
  y:canvas.height/2-100,
  w:300,
  h:200,
  name:"ANA ODA"
 }

 ];


 rooms.forEach(room=>{

  ctx.fillStyle="#27334d";
  ctx.strokeStyle="#66789e";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.roundRect(
   room.x,
   room.y,
   room.w,
   room.h,
   20
  );

  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#c2cbe0";

  ctx.font=
  "bold 15px Arial";

  ctx.textAlign="center";

  ctx.fillText(
   room.name,
   room.x+room.w/2,
   room.y+27
  );

 });

}


function drawPlayer(){

 const x=me.x;
 const y=me.y;

 ctx.fillStyle=me.color;

 ctx.beginPath();

 ctx.roundRect(
  x-20,
  y-10,
  40,
  48,
  13
 );

 ctx.fill();

 ctx.fillStyle="#b9f4ff";

 ctx.beginPath();

 ctx.roundRect(
  x-5,
  y-3,
  28,
  18,
  8
 );

 ctx.fill();

 ctx.fillStyle=me.color;

 ctx.fillRect(
  x-18,
  y+30,
  12,
  12
 );

 ctx.fillRect(
  x+6,
  y+30,
  12,
  12
 );

 ctx.fillStyle="white";

 ctx.font=
 "13px Arial";

 ctx.textAlign="center";

 ctx.fillText(
  me.name,
  x,
  y-20
 );

}


function sendChat(){

 const input=
 document.getElementById(
 "chatInput"
 );

 const message=
 input.value.trim();

 if(!message)return;

 socket.emit(
  "chat",
  message
 );

 input.value="";

}


socket.on(
"chat",
data=>{

 const messages=
 document.getElementById(
 "messages"
 );

 const div=
 document.createElement("div");

 div.innerHTML=
 "<b>"+
 escapeHTML(data.name)+
 ":</b> "+
 escapeHTML(data.message);

 messages.appendChild(div);

 messages.scrollTop=
 messages.scrollHeight;

});


function escapeHTML(text){

 return text
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


function showError(message){

 document.getElementById(
 "error"
 ).textContent=message;

}


function loop(){

 update();
 draw();

 requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
